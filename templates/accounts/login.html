{% extends 'auth_base.html' %}
{% block title %}Log in · Optimum{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<div class="msg error">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<label for="u">Username</label><input id="u" name="username" autofocus required>
<label for="p">Password</label><input id="p" type="password" name="password" required>
<p><button class="btn" style="width:100%">Log in</button></p>
</form>
<p class="muted" style="text-align:center">No account? <a href="{% url 'accounts:register' %}">Register Staff Account</a></p>
{% endblock %}
